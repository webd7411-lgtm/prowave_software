<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Prowave Management</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f8fafc; color: #1e293b; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
        .card { background: #ffffff; border-radius: 16px; padding: 40px 30px; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .icon { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%; background: #eff6ff; display: flex; align-items: center; justify-content: center; }
        .icon svg { width: 36px; height: 36px; fill: #2563eb; }
        h1 { font-size: 22px; margin-bottom: 10px; color: #0f172a; }
        p { font-size: 14px; color: #64748b; line-height: 1.5; margin-bottom: 24px; }
        button { background: #2563eb; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 0 0-8 8c0 1.95.7 3.74 1.87 5.13L4.46 18.54A9.95 9.95 0 0 1 2 12C2 6.48 6.48 2 12 2c2.4 0 4.6.85 6.32 2.27l-1.42 1.42A7.95 7.95 0 0 0 12 4zm9.54 17.54l-1.41 1.41L1.05 3.86l1.41-1.41 19.08 19.09zM12 6c3.31 0 6 2.69 6 6 0 1.05-.28 2.03-.76 2.89l-1.47-1.47A3.98 3.98 0 0 0 16 12a4 4 0 0 0-4-4c-.53 0-1.04.1-1.5.29L9.03 6.82A5.96 5.96 0 0 1 12 6zm-4.7 4.7l5.4 5.4c-.23.06-.46.1-.7.1a4 4 0 0 1-4-4c0-.24.04-.47.1-.7l.2-.8z"/></svg>
        </div>
        <h1>No Internet Connection</h1>
        <p>You appear to be offline. Prowave Management requires an internet connection to securely fetch your latest data.</p>
        <button onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
